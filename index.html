
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OFFICIALBURAY DATA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:white;font-family:Arial,sans-serif}
header{background:#151a28;padding:22px 16px;text-align:center;border-bottom:2px solid #f5c45b}
.logo{font-size:25px;font-weight:900;color:#f5c45b}
header p{color:#c4c8d2;margin-bottom:0}
main{max-width:950px;margin:auto;padding:20px 15px}
h2{color:#f5c45b}
.intro{text-align:center;padding:15px 0 25px}
.intro p{color:#c4c8d2}
#bundles{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px}
.bundle{background:#171e2d;border:1px solid #30394b;border-radius:14px;padding:20px 12px;text-align:center}
.bundle h3{font-size:25px;margin:5px}
.price{font-size:20px;color:#f5c45b;font-weight:bold;margin:12px}
button{background:#f5c45b;color:#17120a;border:0;padding:12px 20px;border-radius:9px;font-weight:bold;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#orderBox{display:none;background:#171e2d;border:1px solid #39445a;border-radius:15px;padding:20px;margin-top:25px}
input{width:100%;padding:14px;margin:8px 0 15px;border-radius:8px;border:1px solid #46516a;background:#0d1220;color:white;font-size:16px}
label{font-weight:bold;font-size:14px}
.small{font-size:13px;color:#aeb6c7}
#message{padding:12px;border-radius:8px;margin-top:15px;display:none}
footer{text-align:center;color:#8790a3;padding:30px 10px;font-size:13px}
</style>
</head>
<body>

<header>
 <div class="logo">OFFICIALBURAY DATA</div>
 <p>Fast and easy MTN data orders</p>
</header>

<main>
 <section class="intro">
  <h2>Buy Your MTN Data</h2>
  <p>Choose your bundle, enter the numbers and place your order.</p>
  <p class="small">No customer registration required.</p>
 </section>

 <h2>Available Bundles</h2>
 <div id="bundles">
  <p>Loading data bundles...</p>
 </div>

 <section id="orderBox">
  <h2>Complete Your Order</h2>
  <p id="selectedBundle"></p>

  <form id="orderForm">
   <label>Your name</label>
   <input id="customerName" type="text" placeholder="Enter your name" required>

   <label>Recipient MTN number</label>
   <input id="recipientPhone" type="tel" inputmode="numeric"
    placeholder="Example: 0241234567" required>

   <label>MTN MoMo payment number</label>
   <input id="momoPhone" type="tel" inputmode="numeric"
    placeholder="Number you will use to pay" required>

   <button id="submitButton" type="submit">Place Order</button>
   <button type="button" id="cancelButton"
    style="background:#39445a;color:white;margin-left:5px">Cancel</button>
  </form>

  <div id="message"></div>
 </section>
</main>

<footer>
 OFFICIALBURAY DATA · Customer support coming soon
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hxlfvhlltuwqhalzrvbr.supabase.co";

const SUPABASE_KEY = "sb_publishable_jrZ6aTftJhYsmKBKjpTjnQ_KI_ZzzlZ";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let selectedBundle = null;

const bundlesBox = document.getElementById("bundles");
const orderBox = document.getElementById("orderBox");
const orderForm = document.getElementById("orderForm");
const messageBox = document.getElementById("message");
const submitButton = document.getElementById("submitButton");

function showMessage(message, success) {
  messageBox.style.display = "block";
  messageBox.style.background = success ? "#123c2a" : "#49202a";
  messageBox.style.color = "white";
  messageBox.textContent = message;
}

function chooseBundle(bundle) {
  selectedBundle = bundle;

  document.getElementById("selectedBundle").textContent =
    bundle.bundle_name + " — GHS " +
    Number(bundle.price_ghs).toFixed(2);

  orderBox.style.display = "block";
  messageBox.style.display = "none";

  orderBox.scrollIntoView({behavior:"smooth"});
}

async function loadBundles() {
  bundlesBox.innerHTML = "<p>Loading bundles...</p>";

  const {data, error} = await db
    .from("data_bundles")
    .select("id,bundle_name,data_gb,price_ghs,is_active")
    .eq("is_active", true)
    .order("data_gb", {ascending:true});

  if (error) {
    bundlesBox.textContent =
      "Unable to load bundles. Please try again later.";
    console.error(error);
    return;
  }

  const available = data.filter(
    b => b.price_ghs !== null && Number(b.price_ghs) > 0
  );

  if (!available.length) {
    bundlesBox.textContent = "No bundles are available yet.";
    return;
  }

  bundlesBox.innerHTML = "";

  available.forEach(bundle => {
    const card = document.createElement("div");
    card.className = "bundle";

    const name = document.createElement("h3");
    name.textContent = bundle.bundle_name;

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = "GHS " + Number(bundle.price_ghs).toFixed(2);

    const buy = document.createElement("button");
    buy.textContent = "BUY NOW";
    buy.addEventListener("click", () => chooseBundle(bundle));

    card.append(name, price, buy);
    bundlesBox.appendChild(card);
  });
}

document.getElementById("cancelButton").onclick = () => {
  orderBox.style.display = "none";
  selectedBundle = null;
};

orderForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!selectedBundle) {
    showMessage("Please select a data bundle first.", false);
    return;
  }

  const customerName =
    document.getElementById("customerName").value.trim();

  const recipientPhone =
    document.getElementById("recipientPhone").value.trim();

  const momoPhone =
    document.getElementById("momoPhone").value.trim();

  const phonePattern = /^0\d{9}$/;

  if (!phonePattern.test(recipientPhone) ||
      !phonePattern.test(momoPhone)) {
    showMessage(
      "Enter both phone numbers in the 10-digit format, for example 0241234567.",
      false
    );
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = "Submitting...";

  const {data, error} = await db.rpc("create_data_order", {
    p_customer_name: customerName,
    p_recipient_phone: recipientPhone,
    p_momo_phone: momoPhone,
    p_bundle_id: selectedBundle.id
  });

  submitButton.disabled = false;
  submitButton.textContent = "Place Order";

  if (error) {
    console.error(error);
    showMessage(
      "Your order could not be submitted. Please try again.",
      false
    );
    return;
  }

  showMessage(
    "Your order has been recorded! Order reference: " +
    String(data) +
    ". Payment is still pending. No payment has been collected yet.",
    true
  );

  orderForm.reset();
});

loadBundles();
</script>
</body>
</html>
